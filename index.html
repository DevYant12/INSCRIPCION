<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SAC UEB - Iniciar Sesión</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    position: relative;
    overflow: hidden;
    background: #ffffff;
  }
  /* Diagonal navy background */
  .diagonal-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #0b3d63;
    clip-path: polygon(0 0, 62% 0, 38% 100%, 0 100%);
    z-index: 0;
  }

  .login-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1080px;
    max-width: 92%;
    height: 400px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
    display: flex;
    overflow: hidden;
    z-index: 2;
  }

  /* Left navy panel inside the card (logo area) */
  .card-left {
    width: 50%;
    background: #0b3d63;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .logo-wrap {
    position: relative;
    transform: skewX(-8deg);
  }
  .logo-text {
    font-size: 78px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 2px;
    line-height: 1;
  }
  .logo-text .sac { color: #fff; }
  .logo-text .ueb { color: #d21f2c; }

  .speed-lines {
    position: absolute;
    left: -70px;
    top: 30%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .speed-lines div {
    height: 6px;
    background: #fff;
  }
  .speed-lines div:nth-child(1) { width: 90px; }
  .speed-lines div:nth-child(2) { width: 130px; }
  .speed-lines div:nth-child(3) { width: 170px; }
  .speed-lines div:nth-child(4) { width: 200px; }

  /* Right white panel (form) */
  .card-right {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 60px;
  }
  .card-right h1 {
    font-size: 26px;
    font-weight: 500;
    color: #222;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 13.5px;
    color: #222;
    margin-bottom: 6px;
  }
  .form-group label .req {
    color: #d21f2c;
  }
  .form-group input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #999;
    border-radius: 4px;
    font-size: 13px;
  }
  .form-group input:focus {
    outline: none;
    border-color: #1a6fd1;
  }
  .forgot {
    display: block;
    text-align: right;
    font-size: 12.5px;
    color: #2a3fd1;
    text-decoration: none;
    margin-bottom: 20px;
  }
  .forgot:hover { text-decoration: underline; }

  .btn-acceder {
    background: #1a6fd1;
    color: #fff;
    border: none;
    padding: 9px 26px;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-acceder:hover {
    background: #155bab;
  }

  .error-msg {
    color: #d21f2c;
    font-size: 12.5px;
    margin-top: 10px;
    display: none;
  }

  @media (max-width: 850px) {
    .login-card { flex-direction: column; height: auto; width: 92%; }
    .card-left, .card-right { width: 100%; }
    .card-left { height: 160px; }
    .logo-text { font-size: 48px; }
    .card-right { padding: 30px; }
  }
</style>
</head>
<body>

<div class="diagonal-bg"></div>

<div class="login-card">
  <div class="card-left">
    <div class="speed-lines"><div></div><div></div><div></div><div></div></div>
    <div class="logo-wrap">
      <div class="logo-text"><span class="sac">SAC</span><span class="ueb">UEB</span></div>
    </div>
  </div>
  <div class="card-right">
    <h1>Credenciales Institucionales</h1>
    <form id="loginForm">
      <div class="form-group">
        <label><span class="req">*</span> Correo Institucional:</label>
        <input type="text" id="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label><span class="req">*</span> Contraseña:</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <a href="#" class="forgot">He olvidado mi contraseña</a>
      <button type="submit" class="btn-acceder">Acceder</button>
      <div class="error-msg" id="errorMsg">Correo o contraseña incorrectos. Inténtalo de nuevo.</div>
    </form>
  </div>
</div>

<script>
  const VALID_EMAIL = "roy.preciado@ueb.edu.ec";
  const VALID_PASSWORD = "12345";

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    if (email === VALID_EMAIL && password === VALID_PASSWORD) {
      window.location.href = "sinet.html";
    } else {
      errorMsg.style.display = "block";
    }
  });
</script>

</body>
</html>
